name: Build Debug APK

# Runs automatically whenever you push to the repo, and can also be
# triggered manually from the "Actions" tab (the "Run workflow" button).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # FIX (15.9.2026): android-actions/setup-android@v3 started failing
      # ("Warning: Failed to find package 'tools'") - it tries to install
      # the legacy "tools" package, which Google has removed from its SDK
      # repository server-side (unrelated to any code change here).
      # GitHub's ubuntu-latest runners already ship a full preinstalled
      # Android SDK (ANDROID_HOME set, common licenses pre-accepted) -
      # dropping this step lets Gradle/AGP use that instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wa-bridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
